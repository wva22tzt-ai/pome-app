:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Malgun Gothic","Apple SD Gothic Neo",serif;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:16px}

select{width:100%;padding:10px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;gap:6px;margin:14px 0}

.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center}
.title{font-size:1.5rem;font-weight:700}.by{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.line{padding:10px 0;border-top:1px dashed var(--line)}.line:first-of-type{border-top:0}
.han{font-size:2.1rem;letter-spacing:.12em}
.py{font-size:.95rem;color:var(--acc2);min-height:1.4em;font-family:system-ui,sans-serif}
.mean{font-size:.9rem;color:var(--mut)}
.hid{visibility:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.btn{padding:11px 16px;font:inherit;font-size:.95rem;border:0;border-radius:999px;background:var(--acc2);color:#fff;cursor:pointer}
.btn.r{background:var(--acc)}.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}.btn.on{outline:3px solid var(--acc)}
.opt{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:.9rem;color:var(--mut)}
.msg{margin-top:12px;text-align:center;font-size:.9rem;color:var(--mut);min-height:1.4em}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:6px;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
.h{display:none}
.line{transition:background .2s;border-radius:10px}.line.on{background:rgba(166,52,42,.13)}.line.on .han{color:var(--acc)}.title{transition:color .2s}.title.on{color:var(--acc)}

const $=i=>document.getElementById(i);
const au=$('au'),me=$('me');let mode=1,loop=true,cur=POEMS[0],rec=null,chunks=[],myUrl=null,cmpOn=false;
POEMS.forEach((p,i)=>$('sel').add(new Option(p.title+" · "+p.by,i)));
function render(){
 cur=POEMS[$('sel').value];$('t').textContent=cur.title;$('a').textContent=cur.by;
 au.src=cur.audio;au.pause();
 $('lines').innerHTML=cur.lines.map(l=>`<div class="line"><div class="han">${l.h}</div><div class="py${mode==2?' hid':''}">${l.p}</div><div class="mean${mode==2?' hid':''}">${l.m}</div></div>`).join('');
 $('play').textContent='▶ 듣기';
}
function setMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.m==m));
 $('b2').classList.toggle('h',m!=2);render();
 $('msg').textContent=m==1?'먼저 음성을 듣고, 독음을 보며 한 줄씩 따라 읽어 보세요.':'독음 없이 한자만 보고 낭송해 보세요. 녹음 후 내 목소리를 들어 볼 수 있어요.';}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
$('sel').onchange=()=>setMode(mode);
$('play').onclick=()=>{if(au.paused){au.play()}else{au.pause()}};
au.onplay=()=>$('play').textContent='⏸ 멈춤';au.onpause=()=>$('play').textContent='▶ 듣기';
au.onended=()=>{if(cmpOn){cmpOn=false;me.play();return}if(loop){au.currentTime=0;au.play()}};
$('loop').onclick=()=>{loop=!loop;$('loop').textContent=loop?'🔁 반복 켜짐':'🔁 반복 끄기'};$('loop').textContent='🔁 반복 켜짐';
document.querySelectorAll('#spd [data-s]').forEach(b=>b.onclick=()=>{au.playbackRate=+b.dataset.s;
 document.querySelectorAll('#spd [data-s]').forEach(x=>x.classList.toggle('on',x===b))});
$('rec').onclick=async()=>{
 if(rec&&rec.state=='recording'){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());
   if(myUrl)URL.revokeObjectURL(myUrl);
   myUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));me.src=myUrl;
   $('rec').textContent='🎙 다시 녹음';$('mine').disabled=$('cmp').disabled=false;
   $('msg').textContent='녹음 완료! 내 목소리를 들어 보세요.';};
  au.pause();rec.start();$('rec').textContent='⏹ 녹음 끝내기';
  $('msg').innerHTML='<span class="rec"></span>녹음 중… 시를 낭송해 보세요.';
 }catch(e){$('msg').textContent='마이크를 사용할 수 없어요. 브라우저 설정에서 마이크 권한을 허용해 주세요.'}};
$('mine').onclick=()=>{au.pause();me.currentTime=0;me.play()};
$('cmp').onclick=()=>{me.pause();cmpOn=true;au.currentTime=0;au.play();$('msg').textContent='선생님 음성 → 내 음성 순서로 재생돼요.'};
function hl(){const s=cur.s,e=cur.e,t=au.currentTime;let k=-2;
 if(s&&!(au.paused&&t==0)&&t<e){k=-1;for(let i=0;i<s.length;i++)if(t>=s[i])k=i}
 $('t').classList.toggle('on',k==-1);
 document.querySelectorAll('.line').forEach((el,i)=>el.classList.toggle('on',i==k));}
setInterval(hl,100);
setMode(1);
